<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="robots" content="noindex, nofollow">
<title>Arsenal Fan Club Members</title>
<style>
  :root { color-scheme: light dark; }
  * { box-sizing: border-box; }
  body {
    margin: 0; padding: 40px 20px;
    font: 16px/1.5 -apple-system, BlinkMacSystemFont, "Segoe UI", system-ui, sans-serif;
    background: #faf8f5; color: #221f1c;
    display: flex; justify-content: center;
  }
  .wrap { width: 100%; max-width: 480px; }
  h1 { font-size: 1.5rem; margin: 0 0 4px; }
  .count { color: #857c72; font-size: .875rem; margin: 0 0 24px; }
  form { display: flex; gap: 8px; margin-bottom: 8px; }
  input {
    flex: 1; padding: 10px 12px; font: inherit;
    border: 1px solid #ddd5cb; border-radius: 8px; background: #fff; color: inherit;
  }
  input:focus { outline: 2px solid #b0754a; outline-offset: -1px; border-color: transparent; }
  button {
    padding: 10px 16px; font: inherit; font-weight: 500; cursor: pointer;
    border: 0; border-radius: 8px; background: #b0754a; color: #fff;
  }
  button:hover { background: #99633c; }
  .error { color: #b3261e; font-size: .875rem; min-height: 20px; margin: 0 0 12px; }
  ul { list-style: none; margin: 0; padding: 0; }
  li {
    display: flex; align-items: center; gap: 12px;
    padding: 12px 4px 12px 14px; border-bottom: 1px solid #ece5dc;
  }
  li .name { flex: 1; }
  li .date { color: #857c72; font-size: .8125rem; }
  .remove {
    background: none; color: #a89e93; padding: 4px 8px; font-size: 1.125rem; line-height: 1;
  }
  .remove:hover { background: none; color: #b3261e; }
  .remove.armed { color: #b3261e; font-size: .8125rem; font-weight: 500; }
  .empty { color: #857c72; padding: 24px 0; text-align: center; }
  .hint { color: #857c72; font-size: .875rem; margin: 0 0 16px; }
  .lock { margin-top: 28px; }
  .lock button {
    background: none; color: #857c72; padding: 0; font-size: .8125rem; font-weight: 400;
    text-decoration: underline;
  }
  .lock button:hover { background: none; color: #221f1c; }
  @media (prefers-color-scheme: dark) {
    body { background: #1a1816; color: #ece7e1; }
    input { background: #252220; border-color: #3a3532; }
    li { border-color: #2e2926; }
    .lock button:hover { color: #ece7e1; }
  }
</style>
</head>
<body>
<div class="wrap">
  <h1>Arsenal Fan Club</h1>

  <!-- Shown only when the deployment has a passcode set. -->
  <section id="gate" hidden>
    <p class="hint">This list is passcode protected. Ask whoever set it up.</p>
    <form id="gateForm">
      <input id="passcode" type="password" placeholder="Passcode" autocomplete="current-password">
      <button type="submit">Unlock</button>
    </form>
    <p class="error" id="gateError"></p>
  </section>

  <section id="app" hidden>
    <p class="count" id="count"></p>

    <form id="form">
      <input id="name" placeholder="Add a member…" autocomplete="off">
      <button type="submit">Add</button>
    </form>
    <p class="error" id="error"></p>

    <ul id="list"></ul>

    <p class="lock" id="lockRow" hidden><button type="button" id="lock">Lock this device</button></p>
  </section>
</div>

<script>
const PASS_KEY = 'bookclub-passcode';
const $list = document.getElementById('list');
const $count = document.getElementById('count');
const $error = document.getElementById('error');
const $name = document.getElementById('name');
const $gate = document.getElementById('gate');
const $app = document.getElementById('app');
const $gateError = document.getElementById('gateError');
const $passcode = document.getElementById('passcode');
const $lockRow = document.getElementById('lockRow');

let passcode = '';
try { passcode = localStorage.getItem(PASS_KEY) || ''; } catch {}

// Every API call carries the passcode when we have one. A 401 means the
// deployment is gated and what we have (if anything) is wrong.
async function api(path, opts = {}) {
  const headers = Object.assign({}, opts.headers || {});
  if (passcode) headers['X-Club-Passcode'] = passcode;
  return fetch(path, Object.assign({}, opts, { headers }));
}

function showGate(message) {
  $app.hidden = true;
  $gate.hidden = false;
  $gateError.textContent = message || '';
  // Drop any names already rendered — hiding the section would leave them
  // sitting in the DOM, which makes "Lock this device" a lie.
  $list.innerHTML = '';
  $count.textContent = '';
  $error.textContent = '';
  $passcode.focus();
}

function showApp() {
  $gate.hidden = true;
  $app.hidden = false;
  $gateError.textContent = '';
  $lockRow.hidden = !passcode;
}

function fmt(iso) {
  return new Date(iso).toLocaleDateString(undefined, { month: 'short', day: 'numeric', year: 'numeric' });
}

function render(members) {
  $count.textContent = members.length === 1 ? '1 member' : members.length + ' members';
  if (!members.length) {
    $list.innerHTML = '<li class="empty">No members yet.</li>';
    return;
  }
  $list.innerHTML = '';
  for (const m of members) {
    const li = document.createElement('li');

    const name = document.createElement('span');
    name.className = 'name';
    name.textContent = m.name;

    const date = document.createElement('span');
    date.className = 'date';
    date.textContent = fmt(m.joined);

    // two-step confirm: first click arms the button, second click removes
    const btn = document.createElement('button');
    btn.className = 'remove';
    btn.type = 'button';
    btn.textContent = '×';
    btn.title = 'Remove ' + m.name;
    btn.onclick = () => {
      if (btn.dataset.armed) return remove(m);
      disarmAll();
      btn.dataset.armed = '1';
      btn.classList.add('armed');
      btn.textContent = 'Remove?';
      btn.timer = setTimeout(disarmAll, 4000);
    };

    li.append(name, date, btn);
    $list.append(li);
  }
}

function disarmAll() {
  for (const b of $list.querySelectorAll('.remove.armed')) {
    clearTimeout(b.timer);
    delete b.dataset.armed;
    b.classList.remove('armed');
    b.textContent = '×';
  }
}

async function load() {
  const res = await api('/api/members');
  if (res.status === 401) {
    return showGate(passcode ? 'That passcode did not work.' : '');
  }
  showApp();
  render(await res.json());
}

async function remove(m) {
  await api('/api/members/' + encodeURIComponent(m.id), { method: 'DELETE' });
  load();
}

document.getElementById('gateForm').onsubmit = (e) => {
  e.preventDefault();
  passcode = $passcode.value.trim();
  try { localStorage.setItem(PASS_KEY, passcode); } catch {}
  $passcode.value = '';
  load();
};

document.getElementById('lock').onclick = () => {
  passcode = '';
  try { localStorage.removeItem(PASS_KEY); } catch {}
  load();
};

document.getElementById('form').onsubmit = async (e) => {
  e.preventDefault();
  $error.textContent = '';
  const name = $name.value.trim();
  if (!name) return;

  const res = await api('/api/members', {
    method: 'POST',
    headers: { 'Content-Type': 'application/json' },
    body: JSON.stringify({ name })
  });

  if (res.status === 401) return showGate('That passcode did not work.');
  if (!res.ok) {
    $error.textContent = (await res.json()).error;
    return;
  }
  $name.value = '';
  load();
};

load();
</script>
</body>
</html>
